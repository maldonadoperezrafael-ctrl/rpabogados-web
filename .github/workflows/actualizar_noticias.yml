name: Actualizar Noticias Judiciales

# Ejecución diaria desactivada: generaba un commit y un despliegue por día para un
# noticias.json que ninguna página lee. Queda manual hasta que Actualidad se administre
# desde la plataforma de contenidos (sección Actualidad autogestionable).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar recopilacion de fallos
        run: python scripts/actualizar_noticias.py

      - name: Guardar cambios si hay noticias nuevas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Resguardar archivo generado y sincronizar limpiamente con main
          cp public/noticias.json /tmp/saved_noticias.json
          git fetch origin main
          git checkout -f -B main origin/main
          cp /tmp/saved_noticias.json public/noticias.json

          git add public/noticias.json
          if git diff --staged --quiet; then
            echo "No hay noticias nuevas en este ciclo. Todo al día."
          else
            git commit -m "chore: actualiza noticias judiciales [skip ci]"
            git push origin main
          fi

name: Actualizar Noticias Judiciales

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar recopilacion de fallos
        run: python scripts/actualizar_noticias.py

      - name: Guardar cambios si hay noticias nuevas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/noticias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualiza noticias judiciales" && git push)
